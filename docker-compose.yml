services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    container_name: gatekeep-falkordb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "${FALKORDB_BROWSER_PORT:-3000}:3000"
    volumes:
      - falkordb-data:/data

volumes:
  falkordb-data:
